name: Sync Upstream
on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com

      - name: Add upstream remote
        run: git remote add upstream https://github.com/alirezarezvani/claude-skills.git

      - name: Fetch upstream
        run: git fetch upstream

      - name: Merge upstream main
        run: git merge upstream/main --no-edit --allow-unrelated-histories || true

      - name: Push to fork
        run: git push origin main
